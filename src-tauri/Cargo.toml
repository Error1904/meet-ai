[package]
name = "adrishyaa-local"
version = "0.1.0"
description = "Adrishyaa-Local: Invisible OS-level AI meeting co-pilot"
authors = ["DeepMind AGY"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
cpal = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
